<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Inter, sans-serif">
  <defs>
    <path id="duo" d="M 486 245 L 330 241 C 268 240, 255 262, 255 312 L 255 405 C 255 448, 282 454, 330 454 L 612 454 C 660 454, 672 432, 672 396 L 672 352 C 672 322, 688 312, 712 318" fill="none" stroke-linejoin="round"/>
    <path id="yey" d="M 712 318 C 790 325, 880 350, 910 410 C 935 470, 930 530, 950 590" fill="none" stroke-linecap="round"/>
  </defs>
  <rect x="2" y="2" width="996" height="996" rx="36" fill="#ffffff" stroke="#ffc2cf" stroke-width="4"/>

  <!-- Vértebras -->
  <g fill="#efe9e1" stroke="#cbbfb1" stroke-width="3">
    <rect x="470" y="200" width="180" height="80" rx="14"/>
    <rect x="470" y="300" width="180" height="80" rx="14"/>
    <rect x="470" y="400" width="180" height="80" rx="14"/>
    <rect x="470" y="500" width="180" height="80" rx="14"/>
  </g>

  <!-- VCI y aorta -->
  <rect x="505" y="110" width="40" height="760" rx="20" fill="#5b8fe0"/>
  <rect x="580" y="110" width="40" height="760" rx="20" fill="#e0302f"/>

  <!-- Ligamento de Treitz (por detrás del páncreas) -->
  <path d="M 708 300 C 702 250, 694 190, 680 120" fill="none" stroke="#8d5a3b" stroke-width="10" stroke-dasharray="14 8" stroke-linecap="round"/>

  <!-- Duodeno -->
  <use href="#duo" stroke="#d9534f" stroke-width="66"/>
  <use href="#duo" stroke="#f7b6b2" stroke-width="52"/>
  <ellipse cx="440" cy="244" rx="40" ry="28" fill="#fbd3cf"/>
  <!-- Yeyuno -->
  <use href="#yey" stroke="#c9605c" stroke-width="58"/>
  <use href="#yey" stroke="#f6cdbd" stroke-width="44"/>

  <!-- Estómago (antro) y píloro -->
  <path d="M 478 214 C 515 206, 545 188, 570 160 C 585 143, 600 130, 615 124 L 640 172 C 625 180, 612 192, 600 208 C 570 248, 528 274, 478 276 Z" fill="#f4c7c3" stroke="#d98c8c" stroke-width="4"/>
  <rect x="472" y="210" width="16" height="70" rx="6" fill="#b84c49"/>

  <!-- Páncreas -->
  <path d="M 295 300 C 295 283, 330 280, 380 282 C 440 284, 480 278, 520 268 C 600 248, 700 232, 790 222 C 830 218, 850 222, 850 236 C 850 252, 820 258, 790 262 C 720 270, 680 280, 640 288 C 600 296, 578 306, 570 330 C 562 360, 570 392, 560 410 C 540 422, 480 420, 420 418 C 330 418, 295 400, 295 360 Z" fill="#fbdc96" stroke="#d6a640" stroke-width="4"/>
  <text x="380" y="350" font-size="22" font-weight="700" fill="#8a6300" text-anchor="middle">Cabeza del</text>
  <text x="380" y="376" font-size="22" font-weight="700" fill="#8a6300" text-anchor="middle">páncreas</text>
  <text x="760" y="248" font-size="18" font-weight="700" fill="#8a6300" text-anchor="middle">Cuerpo</text>

  <!-- AMS y VMS (por delante de la 3ª porción) -->
  <path d="M 600 322 C 598 420, 592 560, 590 760" fill="none" stroke="#c62828" stroke-width="18" stroke-linecap="round"/>
  <path d="M 566 326 C 564 420, 560 560, 556 760" fill="none" stroke="#2f6fd1" stroke-width="18" stroke-linecap="round"/>

  <!-- Etiquetas -->
  <g font-size="23" fill="#2b2b2b">
    <line x1="290" y1="150" x2="360" y2="212" stroke="#8a8a8a" stroke-width="2"/>
    <text x="40" y="140" font-weight="700" fill="#ff4354">1ª porción · superior</text>
    <text x="40" y="168" font-size="20" fill="#555">L1 · ~5 cm · bulbo móvil</text>

    <line x1="420" y1="110" x2="474" y2="204" stroke="#8a8a8a" stroke-width="2"/>
    <text x="370" y="100">Píloro</text>
    <text x="560" y="108" font-size="20" fill="#555">Estómago</text>

    <line x1="200" y1="355" x2="222" y2="355" stroke="#8a8a8a" stroke-width="2"/>
    <text x="196" y="330" text-anchor="end" font-weight="700" fill="#ff4354">2ª porción</text>
    <text x="196" y="356" text-anchor="end" font-weight="700" fill="#ff4354">descendente</text>
    <text x="196" y="384" text-anchor="end" font-size="20" fill="#555">L1–L3 · 7–10 cm</text>

    <line x1="330" y1="540" x2="360" y2="487" stroke="#8a8a8a" stroke-width="2"/>
    <text x="200" y="568" font-weight="700" fill="#ff4354">3ª porción · horizontal</text>
    <text x="200" y="594" font-size="20" fill="#555">cruza L3 · 6–8 cm</text>

    <line x1="700" y1="625" x2="680" y2="430" stroke="#8a8a8a" stroke-width="2"/>
    <text x="660" y="652" font-weight="700" fill="#ff4354">4ª porción · ascendente</text>
    <text x="660" y="678" font-size="20" fill="#555">L3 → borde sup. de L2 · ~5 cm</text>

    <line x1="752" y1="452" x2="716" y2="336" stroke="#8a8a8a" stroke-width="2"/>
    <text x="712" y="476" font-size="20">Flexura</text>
    <text x="712" y="500" font-size="20">duodenoyeyunal</text>

    <line x1="730" y1="150" x2="690" y2="160" stroke="#8a8a8a" stroke-width="2"/>
    <text x="736" y="146" font-size="21" fill="#6d4027" font-weight="700">M. suspensorio</text>
    <text x="736" y="170" font-size="21" fill="#6d4027" font-weight="700">(lig. de Treitz)</text>

    <text x="790" y="566" font-size="21" fill="#555">Yeyuno</text>

    <text x="525" y="905" text-anchor="middle" font-size="21" fill="#2f6fd1" font-weight="700">VCI</text>
    <text x="600" y="905" text-anchor="middle" font-size="21" fill="#c62828" font-weight="700">Aorta</text>
    <text x="440" y="800" font-size="20" fill="#2f6fd1" font-weight="700">VMS</text>
    <text x="640" y="800" font-size="20" fill="#c62828" font-weight="700">AMS</text>
    <line x1="490" y1="793" x2="550" y2="760" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="638" y1="793" x2="596" y2="760" stroke="#8a8a8a" stroke-width="2"/>
  </g>
  <text x="40" y="960" font-size="20" fill="#888">Vista anterior (esquema)</text>
</svg>
